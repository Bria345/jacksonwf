<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jackson Weather</title>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
    <link rel="stylesheet" href="src/style.css" /> 
</head>
<body>
  <div class="weather-app">
    <header>
        <form class="search-form" id="search-form">
            <input type="search" placeholder="Enter a City.." required id="search-form-input" class="search-form-input"/>
            <input type="submit" value="Search" class="search-form-button"/>
        </form>
    </header>
    <main>
        <div class="weather-info">   
          <div>
            <h1 class="weather-city" id="city">Cayman Islands</h1> 
            <p class="weather-description">
                <span id="time"></span>, <span id="description">clear sky</span>
                <br /> 
                Humidity: <strong id="humidity">60%</strong>, Wind: <strong id="wind">10 mph</strong>
            </p>
          </div>
          <div class="weather-temp-container">
                <div class="weather-temp-icon">☀️</div> 
                <div class="weather-temp-value" id="temperature">--</div>
                <div class="weather-temp-unit">°F</div>
          </div>
        </div>
    </main>
    <footer>
        Coded with ❤️ by <a href="https://github.com">Briana Jackson</a>, 
        is <a href="https://github.com/JacksonWF">open-sourced on GitHub</a> and 
        <a href="https://netlify.app">hosted on Netlify</a>.    
    </footer>
  </div>
  <script src="src/index.js"></script>
</body>
</html>
